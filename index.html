<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的植物小伙伴</title>
    <script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0-beta.10/libs/cn/index.js"></script>
    <script src="https://cdn.tailwindcss.com/3.3.3"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/mobile-styles.css">
    <script src="config.js"></script>
</head>
<body>
    <!-- 顶部标题 -->
    <div class="py-4 px-4 text-center">
        <h1 class="text-2xl font-bold text-green-700">我的植物小伙伴</h1>
        <p class="text-sm text-gray-600 mt-1">拍照识别·智能对话·养护记录</p>
    </div>

    <!-- 主页面 -->
    <div class="container mx-auto py-4 px-4">
        <!-- 植物展示卡片 -->
        <div class="bg-white rounded-xl shadow-md overflow-hidden max-w-md mx-auto mb-6">
            <div class="p-6 text-center">
                <div class="mb-6 relative">
                    <div class="plant-image-container">
                        <img id="plant-image" src="https://s.coze.cn/image/IBl8j7eurhQ" alt="苔藓" class="plant-image">
                        <button id="prev-plant" class="btn absolute left-0 top-1/2 transform -translate-y-1/2 -translate-x-1/2 w-10 h-10 rounded-full bg-white shadow flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button id="next-plant" class="btn absolute right-0 top-1/2 transform -translate-y-1/2 translate-x-1/2 w-10 h-10 rounded-full bg-white shadow flex items-center justify-center">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                    <p id="plant-name" class="text-xl font-medium mt-4 text-green-600">苔藓</p>
                </div>
                
                <div class="text-center mb-6">
                    <p class="text-gray-500">连续浇水</p>
                    <p id="streak-days" class="text-2xl font-bold text-green-600">0天</p>
                </div>
            </div>
        </div>
        
        <!-- 功能按钮 -->
        <div class="max-w-md mx-auto space-y-4">
            <button id="camera-btn" class="w-full btn bg-green-500 text-white py-4 rounded-xl text-lg font-medium flex items-center justify-center">
                <i class="fas fa-camera mr-3"></i> 拍照识别植物
            </button>
            
            <button id="talk-btn" class="w-full btn bg-blue-500 text-white py-4 rounded-xl text-lg font-medium flex items-center justify-center">
                <i class="fas fa-comment-dots mr-3"></i> 和<span id="current-plant-name">植物</span>聊天
            </button>
            
            <button id="water-btn" class="w-full btn bg-yellow-500 text-white py-4 rounded-xl text-lg font-medium flex items-center justify-center">
                <i class="fas fa-tint mr-3"></i> 浇水记录
            </button>
        </div>
    </div>

    <!-- 拍照识别功能区域 -->
    <div id="camera-section" class="hidden container mx-auto py-4 px-4">
        <div class="bg-white rounded-xl shadow-md p-6 max-w-md mx-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-green-700">拍照识别植物</h3>
                <button id="close-camera-section" class="btn text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="text-center">
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <button id="camera-open-btn" class="bg-green-50 p-4 rounded-lg border-2 border-green-200 hover:border-green-300 transition-all">
                        <i class="fas fa-camera text-green-600 text-2xl mb-2"></i>
                        <p class="text-sm font-medium text-green-700">打开相机</p>
                    </button>
                    
                    <button id="gallery-btn" class="bg-blue-50 p-4 rounded-lg border-2 border-blue-200 hover:border-blue-300 transition-all">
                        <i class="fas fa-images text-blue-600 text-2xl mb-2"></i>
                        <p class="text-sm font-medium text-blue-700">选择照片</p>
                    </button>
                </div>
                
                <!-- 摄像头预览 -->
                <div id="camera-preview" class="hidden">
                    <video id="camera-video" class="w-full rounded-lg border-2 border-green-300 mb-4" autoplay playsinline></video>
                    <div class="flex justify-center space-x-4">
                        <button id="capture-btn" class="btn bg-green-500 text-white px-6 py-2 rounded-lg">
                            <i class="fas fa-camera mr-2"></i>拍照
                        </button>
                        <button id="close-camera-btn" class="btn bg-gray-500 text-white px-6 py-2 rounded-lg">
                            关闭相机
                        </button>
                    </div>
                </div>
                
                <!-- 照片预览 -->
                <div id="photo-preview" class="hidden">
                    <img id="preview-image" class="w-full rounded-lg border-2 border-blue-300 mb-4" alt="预览图片">
                    <div class="flex justify-center space-x-4">
                        <button id="analyze-btn" class="btn bg-blue-500 text-white px-6 py-2 rounded-lg">
                            <i class="fas fa-search mr-2"></i>识别植物
                        </button>
                        <button id="close-preview-btn" class="btn bg-gray-500 text-white px-6 py-2 rounded-lg">
                            重新选择
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 简化的提示框 -->
    <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-lg opacity-0 transition-opacity z-50">
        提示信息
    </div>

    <!-- JavaScript 文件 -->
    <script src="js/data.js"></script>
    <script src="js/photo-recognition.js"></script>
    <script src="js/photo-recognition-extra.js"></script>
    <script src="js/coze-sdk.js"></script>
    <script src="js/app-simple.js"></script>
</body>
</html>
