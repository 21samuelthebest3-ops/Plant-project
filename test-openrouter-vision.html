<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenRouter GPT-4o 植物识别测试</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Noto Sans SC', 'Helvetica Neue', Arial, 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; margin: 24px; }
    .card { max-width: 960px; margin: 0 auto; border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; }
    .row { display: flex; gap: 20px; align-items: flex-start; }
    .img { width: 360px; border-radius: 8px; border: 1px solid #eee; }
    pre { background: #0b1021; color: #c8d3f5; padding: 12px; border-radius: 6px; overflow: auto; }
    button { padding: 10px 16px; background: #16a34a; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
    button[disabled] { opacity: .6; cursor: not-allowed; }
  </style>
  <script src="config.js"></script>
  <script>
    async function runTest() {
      const API_KEY = (window.APP_CONFIG && window.APP_CONFIG.OPENROUTER_API_KEY) || '';
      const MODEL = (window.APP_CONFIG && window.APP_CONFIG.OPENROUTER_MODEL) || 'openai/gpt-4o';
      const API_URL = 'https://openrouter.ai/api/v1/chat/completions';
      const btn = document.getElementById('run-btn');
      const out = document.getElementById('out');
      const resultBox = document.getElementById('result');
      out.textContent = '';
      resultBox.textContent = '';

      if (!API_KEY) {
        alert('未配置 OPENROUTER_API_KEY，请先编辑 config.js');
        return;
      }

      btn.disabled = true;
      btn.textContent = '测试中...';

      try {
        // 读取本地 rose.jpeg 并转为 data URL
        const imgResp = await fetch('rose.jpeg');
        if (!imgResp.ok) throw new Error('无法读取 rose.jpeg');
        const blob = await imgResp.blob();
        const dataUrl = await new Promise((resolve) => {
          const r = new FileReader();
          r.onload = () => resolve(r.result);
          r.readAsDataURL(blob);
        });

        const payload = {
          model: MODEL,
          messages: [
            { role: 'system', content: '你是植物识别专家，请严格返回 JSON：{"name":"中英文名或中文名","confidence":0-1,"reason":"分析要点"}。只输出 JSON。' },
            {
              role: 'user',
              content: [
                { type: 'text', text: '识别这张植物图片，给出名称、置信度与理由（只返回JSON）。' },
                { type: 'image_url', image_url: { url: dataUrl } }
              ]
            }
          ],
          max_tokens: 300,
          temperature: 0.1
        };

        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin,
            'X-Title': 'Plant Companion Vision Test'
          },
          body: JSON.stringify(payload)
        });

        const json = await resp.json();
        out.textContent = JSON.stringify(json, null, 2);

        let content = json?.choices?.[0]?.message?.content || '';
        // 解析 JSON 内容
        try {
          const parsed = JSON.parse(content);
          resultBox.textContent = JSON.stringify(parsed, null, 2);
        } catch (e) {
          resultBox.textContent = '响应非JSON，原文:\n' + content;
        }
      } catch (err) {
        out.textContent = '错误: ' + err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '运行识别测试';
      }
    }
  </script>
</head>
<body>
  <div class="card">
    <h2>OpenRouter GPT-4o 植物识别测试</h2>
    <p>目标：识别仓库中的 <code>rose.jpeg</code>，期望结果为玫瑰。</p>
    <div class="row">
      <img class="img" src="rose.jpeg" alt="rose" />
      <div>
        <button id="run-btn" onclick="runTest()"><i class="fas fa-vial"></i> 运行识别测试</button>
        <p>配置从 <code>config.js</code> 读取，不会提交到 Git。</p>
      </div>
    </div>
    <h3>解析结果</h3>
    <pre id="result"></pre>
    <h3>完整响应</h3>
    <pre id="out"></pre>
  </div>
</body>
</html>
